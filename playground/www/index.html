<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tpt-symbolic playground</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #fff; --muted: #6e6e73; --line: #d2d2d7; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fg: #f5f5f7; --bg: #1c1c1e; --muted: #98989d; --line: #3a3a3c; } }
  :root[data-theme="dark"] { --fg: #f5f5f7; --bg: #1c1c1e; --muted: #98989d; --line: #3a3a3c; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 16px; }
  form { display: grid; grid-template-columns: 1fr; gap: 8px; border-top: 1px solid var(--line); padding: 12px 0; }
  label { font-weight: 600; }
  input, select { font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 100%; box-sizing: border-box; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--fg); color: var(--bg); cursor: pointer; justify-self: start; }
  pre { white-space: pre-wrap; word-break: break-word; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 0; min-height: 1.5em; }
  .error { color: #c0392b; }
</style>
</head>
<body>
<main>
  <h1>tpt-symbolic playground</h1>
  <p class="lead">Exact symbolic mathematics, running in your browser. Type an expression, pick an operation.</p>

  <form data-op="simplify">
    <label for="simplify-in">Simplify</label>
    <input id="simplify-in" value="(x+1)^2 - x^2" autocomplete="off">
    <button type="submit">Run</button>
    <pre></pre>
  </form>

  <form data-op="diff">
    <label for="diff-in">Differentiate</label>
    <input id="diff-in" value="sin(x^2)" autocomplete="off">
    <input id="diff-var" value="x" aria-label="variable" autocomplete="off">
    <button type="submit">Run</button>
    <pre></pre>
  </form>

  <form data-op="integrate">
    <label for="integrate-in">Integrate</label>
    <input id="integrate-in" value="x*cos(x^2)" autocomplete="off">
    <input id="integrate-var" value="x" aria-label="variable" autocomplete="off">
    <button type="submit">Run</button>
    <pre></pre>
  </form>

  <form data-op="solve">
    <label for="solve-in">Solve</label>
    <input id="solve-in" value="x^2 + 2*x - 2 = 0" autocomplete="off">
    <input id="solve-var" value="x" aria-label="variable" autocomplete="off">
    <button type="submit">Run</button>
    <pre></pre>
  </form>

  <form data-op="latex">
    <label for="latex-in">LaTeX</label>
    <input id="latex-in" value="x/(x^2+1)" autocomplete="off">
    <button type="submit">Run</button>
    <pre></pre>
  </form>
</main>

<script type="module">
  // The glue is generated by `wasm-bindgen --target web` (see playground/README.md).
  import init, * as wasm from "./pkg/tpt_symbolic_playground.js";

  const run = {
    simplify: (f) => wasm.simplify_text(f.querySelector("input").value),
    diff: (f) => wasm.diff_text(f.querySelector("input").value, f.querySelector("input + input").value),
    integrate: (f) => wasm.integrate_text(f.querySelector("input").value, f.querySelector("input + input").value),
    solve: (f) => wasm.solve_text(f.querySelector("input").value, f.querySelector("input + input").value),
    latex: (f) => wasm.latex_text(f.querySelector("input").value),
  };

  try {
    await init();
  } catch (err) {
    document.querySelector("main").insertAdjacentHTML("beforeend", `<p class="error">Could not load the WebAssembly module: ${err}</p>`);
  }

  for (const form of document.querySelectorAll("form[data-op]")) {
    const out = form.querySelector("pre");
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      try {
        out.classList.remove("error");
        out.textContent = run[form.dataset.op](form);
      } catch (err) {
        out.classList.add("error");
        out.textContent = String(err);
      }
    });
  }
</script>
</body>
</html>
